name: Hourly Ingestion Pipeline
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
name: Locktrace Ingestion Pipeline
on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - locktrace_visit
permissions:
  contents: write
concurrency:
  group: locktrace-ingest
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4